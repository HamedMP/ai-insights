name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Generated harness files are up to date
        run: node scripts/generate-harness.mjs --check

      # Regenerates the price table from the committed snapshot; no network.
      - name: Generated price table is up to date
        run: node scripts/update-prices.mjs --check

      - name: Build
        run: pnpm build

  # Site component tests (tests/site-render) render site/ React components, so they need site/'s own install.
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            site/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm --dir site install --frozen-lockfile

      - name: Site component tests
        run: pnpm test:site
