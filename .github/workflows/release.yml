name: Release

# Publishes to npm when a version tag is pushed. Uses npm trusted publishing (OIDC): no token is stored
# anywhere. The package must list this repository and this workflow file as a trusted publisher on npmjs.com.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      # The pnpm version comes from packageManager in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Tag must match package.json
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"

      # Trusted publishing needs npm 11.5.1 or newer.
      - run: npm install -g npm@latest

      # prepublishOnly runs the checks and the build.
      - run: npm publish --access public
