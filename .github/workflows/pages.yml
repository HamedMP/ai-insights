name: Pages

# The site lives at https://ai-insights.app/ (Vercel). GitHub Pages only serves a redirect so links to
# hamedmp.github.io/ai-insights/..., including 0.3.0 share links whose stats are in the #fragment, keep working.
on:
  push:
    branches: [main]
    paths:
      - "site/pages-redirect/**"
      - "site/scripts/check-build.mjs"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Fails if the redirect pages would load anything from another host.
      - run: node site/scripts/check-build.mjs --redirect

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/pages-redirect

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
