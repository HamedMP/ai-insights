[package]
name = "ai-insights-desktop"
version = "0.1.0"
description = "Menu bar and system tray app for AI Insights"
license = "MIT"
edition = "2021"
rust-version = "1.85"
publish = false

[lib]
name = "ai_insights_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "=2.7.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# tauri.macos.conf.json makes the popover window transparent (rounded corners), which needs this feature;
# it is macOS-only so the Linux and Windows builds keep the config and the features in step.
[target.'cfg(target_os = "macos")'.dependencies]
tauri = { version = "=2.12.5", features = ["tray-icon", "image-png", "macos-private-api"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
