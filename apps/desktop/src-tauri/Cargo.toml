[package]
name = "ai-insights-desktop"
version = "0.1.0"
description = "Menu bar and system tray app for AI Insights"
license = "MIT"
edition = "2021"
rust-version = "1.85"
publish = false

[lib]
name = "ai_insights_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
# macos-private-api: the macOS popover window is transparent so the page can draw rounded corners
# (tauri.macos.conf.json). tauri-build requires the feature and `macOSPrivateApi` to match on every platform;
# both are no-ops outside macOS.
tauri = { version = "=2.12.5", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-opener = "=2.7.2"
tauri-plugin-notification = "=2.7.0"
tauri-plugin-autostart = "=2.7.0"
tauri-plugin-single-instance = "=2.5.4"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
